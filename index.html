<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            width: 100%;
            overflow-x: hidden;
        }

        .navbar {
            background-color: antiquewhite;
            height: 4rem;
            display: flex;
            align-items: center;
            position: relative;
        }

        .img-container {
            position: absolute;
            left: 2rem;
        }

        .img {
            width: 50px;
            height: 50px;
        }

        .nav-list {
            display: flex;
            gap: 50px;
            align-items: center;
            list-style-type: none;
            margin: auto;
        }

        .nav-list li a {
            text-decoration: none;
            color: black;
            font-size: 18px;
        }

        .banner-section {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 4rem 2rem;
        }

        .banner {
            border: 1px solid red;
            height: 400px;
            width: 90%;
        }

        .card-section {
            width: 90%;
            margin: 3rem auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .card {
            height: 400px;
            border: 1px solid black;
        }

        .footer-container {
            margin-top: 2rem;
            height: 100px;
            background-color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="img-container">
                <img class="img" alt="Logo">
            </div>

            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html">Category</a></li>
                <li><a href="index.html">Product</a></li>
            </ul>

        </nav>
    </header>

    <section>

        <div class="banner-section">
            <div class="banner"></div>
        </div>

        <div class="card-section">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>

    </section>

    <footer>
        <div class="footer-container">
            <h3>Footer</h3>
        </div>
    </footer>

</body>

</html>
